name: rssmonster

services:
  rssmonster:
    image: rssmonster/rssmonster:${RSSMONSTER_TAG:-latest}
    container_name: rssmonster
    restart: unless-stopped

    ports:
      - "${RSSMONSTER_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      # SQLite is the default database for simple self-hosted installations.
      DB_DIALECT: sqlite
      DB_STORAGE: /app/data/rssmonster.sqlite

      # Required application secrets.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FEVER_CREDENTIAL_SECRET: ${FEVER_CREDENTIAL_SECRET:?FEVER_CREDENTIAL_SECRET must be set}

      # Optional deployment settings.
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      RSSMONSTER_INTERNAL_HOST_ALLOWLIST: ${RSSMONSTER_INTERNAL_HOST_ALLOWLIST:-}

    volumes:
      - rssmonster-data:/app/data

    init: true

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3000/api/health')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  rssmonster-data: