name: rssmonster

services:
  rssmonster:
    image: rssmonster/rssmonster:${RSSMONSTER_TAG:-latest}
    container_name: rssmonster
    restart: unless-stopped

    ports:
      - "${RSSMONSTER_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      # SQLite is for lightweight local experimentation. This profile intentionally
      # omits the AI worker; use the MySQL profile for database-intensive AI jobs.
      DB_DIALECT: sqlite
      DB_STORAGE: /app/data/rssmonster.sqlite

      # Required application secrets.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FEVER_CREDENTIAL_SECRET: ${FEVER_CREDENTIAL_SECRET:?FEVER_CREDENTIAL_SECRET must be set}

      # Optional deployment settings.
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      RSSMONSTER_INTERNAL_HOST_ALLOWLIST: ${RSSMONSTER_INTERNAL_HOST_ALLOWLIST:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

      # The quick-start deployment runs without an inference service.
      INFERENCE_AI_ENABLED: "false"
      SKIP_ARTICLE_CLASSIFICATION_ANALYSIS: "true"
      SKIP_ARTICLE_EMBEDDINGS: "true"
      SKIP_SEMANTIC_LABELING: "true"
      CRAWL_WORKER_HEALTH_FILE: /app/worker-health/crawl-worker-health.json

    volumes:
      - rssmonster-data:/app/data
      - rssmonster-worker-health:/app/worker-health:ro

    init: true

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3000/api/health')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  rssmonster-worker:
    image: rssmonster/rssmonster:${RSSMONSTER_TAG:-latest}
    container_name: rssmonster-worker
    restart: unless-stopped

    depends_on:
      rssmonster:
        condition: service_healthy
        restart: true

    command:
      - npm
      - run
      - start:worker

    environment:
      NODE_ENV: production
      # Crawl-only by design. SQLite optional-job concurrency is limited to one,
      # and this lightweight profile does not start rssmonster-ai-worker.
      DB_DIALECT: sqlite
      DB_STORAGE: /app/data/rssmonster.sqlite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FEVER_CREDENTIAL_SECRET: ${FEVER_CREDENTIAL_SECRET:?FEVER_CREDENTIAL_SECRET must be set}
      RSSMONSTER_INTERNAL_HOST_ALLOWLIST: ${RSSMONSTER_INTERNAL_HOST_ALLOWLIST:-}
      INFERENCE_AI_ENABLED: "false"
      SKIP_ARTICLE_CLASSIFICATION_ANALYSIS: "true"
      SKIP_ARTICLE_EMBEDDINGS: "true"
      SKIP_SEMANTIC_LABELING: "true"
      CRAWL_WORKER_HEALTH_FILE: /app/worker-health/crawl-worker-health.json
      CRAWL_WORKER_HEALTH_MAX_FAILURES: ${CRAWL_WORKER_HEALTH_MAX_FAILURES:-3}
      CRAWL_WORKER_HEALTH_MAX_STALE_MS: ${CRAWL_WORKER_HEALTH_MAX_STALE_MS:-900000}

    volumes:
      - rssmonster-data:/app/data
      - rssmonster-worker-health:/app/worker-health

    init: true

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - src/workers/checkCrawlWorkerHealth.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

volumes:
  rssmonster-data:
  rssmonster-worker-health:
