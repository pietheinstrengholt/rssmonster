name: rssmonster

services:
  rssmonster:
    image: "${RSSMONSTER_IMAGE:-rssmonster/rssmonster:${RSSMONSTER_TAG:-latest}}"
    container_name: rssmonster
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      inference:
        condition: service_healthy
        restart: true

    ports:
      - "${RSSMONSTER_BIND_ADDRESS:-127.0.0.1}:${RSSMONSTER_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOSTNAME: mysql
      DB_DIALECT: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rssmonster}
      DB_USERNAME: ${DB_USERNAME:-rssmonster}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FEVER_CREDENTIAL_SECRET: ${FEVER_CREDENTIAL_SECRET:?FEVER_CREDENTIAL_SECRET must be set}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RSSMONSTER_INTERNAL_HOST_ALLOWLIST: ${RSSMONSTER_INTERNAL_HOST_ALLOWLIST:-}
      FEED_MAX_COUNT: ${FEED_MAX_COUNT:-100}
      FEED_CONNECT_TIMEOUT_MS: ${FEED_CONNECT_TIMEOUT_MS:-10000}
      FEED_BODY_TIMEOUT_MS: ${FEED_BODY_TIMEOUT_MS:-30000}
      FEED_TIMEOUT_MS: ${FEED_TIMEOUT_MS:-60000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      INFERENCE_URL: http://inference:3001
      INFERENCE_TIMEOUT_MS: ${INFERENCE_TIMEOUT_MS:-600000}
      INFERENCE_CIRCUIT_FAILURE_THRESHOLD: ${INFERENCE_CIRCUIT_FAILURE_THRESHOLD:-5}
      INFERENCE_CIRCUIT_COOLDOWN_MS: ${INFERENCE_CIRCUIT_COOLDOWN_MS:-30000}
      INFERENCE_AI_ENABLED: "true"
      INFERENCE_ASSISTANT_ENABLED: ${INFERENCE_ASSISTANT_ENABLED:-false}
      SKIP_ARTICLE_CLASSIFICATION_ANALYSIS: "false"
      SKIP_ARTICLE_EMBEDDINGS: "false"
      SKIP_SEMANTIC_LABELING: ${SKIP_SEMANTIC_LABELING:-false}
      CRAWL_WORKER_HEALTH_FILE: /app/worker-health/crawl-worker-health.json
      AI_WORKER_HEALTH_FILE: /app/worker-health/ai-worker-health.json

    volumes:
      - rssmonster-worker-health:/app/worker-health:ro

    init: true

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3000/api/health')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - rssmonster-network

  rssmonster-worker:
    image: "${RSSMONSTER_IMAGE:-rssmonster/rssmonster:${RSSMONSTER_TAG:-latest}}"
    container_name: rssmonster-worker
    restart: unless-stopped

    depends_on:
      rssmonster:
        condition: service_healthy
        restart: true
      inference:
        condition: service_healthy
        restart: true

    command:
      - npm
      - run
      - start:worker

    environment:
      NODE_ENV: production
      DB_HOSTNAME: mysql
      DB_DIALECT: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rssmonster}
      DB_USERNAME: ${DB_USERNAME:-rssmonster}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FEVER_CREDENTIAL_SECRET: ${FEVER_CREDENTIAL_SECRET:?FEVER_CREDENTIAL_SECRET must be set}
      RSSMONSTER_INTERNAL_HOST_ALLOWLIST: ${RSSMONSTER_INTERNAL_HOST_ALLOWLIST:-}
      FEED_MAX_COUNT: ${FEED_MAX_COUNT:-100}
      FEED_CONNECT_TIMEOUT_MS: ${FEED_CONNECT_TIMEOUT_MS:-10000}
      FEED_BODY_TIMEOUT_MS: ${FEED_BODY_TIMEOUT_MS:-30000}
      FEED_TIMEOUT_MS: ${FEED_TIMEOUT_MS:-60000}
      INFERENCE_URL: http://inference:3001
      INFERENCE_TIMEOUT_MS: ${INFERENCE_TIMEOUT_MS:-600000}
      INFERENCE_CIRCUIT_FAILURE_THRESHOLD: ${INFERENCE_CIRCUIT_FAILURE_THRESHOLD:-5}
      INFERENCE_CIRCUIT_COOLDOWN_MS: ${INFERENCE_CIRCUIT_COOLDOWN_MS:-30000}
      INFERENCE_AI_ENABLED: "true"
      SKIP_ARTICLE_CLASSIFICATION_ANALYSIS: "false"
      SKIP_ARTICLE_EMBEDDINGS: "false"
      SKIP_SEMANTIC_LABELING: ${SKIP_SEMANTIC_LABELING:-false}
      CRAWL_PRIORITY_LEASE_MS: ${CRAWL_PRIORITY_LEASE_MS:-90000}
      CRAWL_PRIORITY_HEARTBEAT_MS: ${CRAWL_PRIORITY_HEARTBEAT_MS:-30000}
      CRAWL_WORKER_HEALTH_FILE: /app/worker-health/crawl-worker-health.json
      CRAWL_WORKER_HEALTH_MAX_FAILURES: ${CRAWL_WORKER_HEALTH_MAX_FAILURES:-3}
      CRAWL_WORKER_HEALTH_MAX_STALE_MS: ${CRAWL_WORKER_HEALTH_MAX_STALE_MS:-900000}

    init: true

    volumes:
      - rssmonster-worker-health:/app/worker-health

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - src/workers/checkCrawlWorkerHealth.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

    networks:
      - rssmonster-network

  rssmonster-ai-worker:
    image: "${RSSMONSTER_IMAGE:-rssmonster/rssmonster:${RSSMONSTER_TAG:-latest}}"
    container_name: rssmonster-ai-worker
    restart: unless-stopped

    depends_on:
      rssmonster:
        condition: service_healthy
        restart: true
      inference:
        condition: service_healthy
        restart: true

    command:
      - npm
      - run
      - start:ai-worker

    environment:
      NODE_ENV: production
      DB_HOSTNAME: mysql
      DB_DIALECT: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rssmonster}
      DB_USERNAME: ${DB_USERNAME:-rssmonster}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FEVER_CREDENTIAL_SECRET: ${FEVER_CREDENTIAL_SECRET:?FEVER_CREDENTIAL_SECRET must be set}
      RSSMONSTER_INTERNAL_HOST_ALLOWLIST: ${RSSMONSTER_INTERNAL_HOST_ALLOWLIST:-}
      INFERENCE_URL: http://inference:3001
      INFERENCE_TIMEOUT_MS: ${INFERENCE_TIMEOUT_MS:-600000}
      INFERENCE_CIRCUIT_FAILURE_THRESHOLD: ${INFERENCE_CIRCUIT_FAILURE_THRESHOLD:-5}
      INFERENCE_CIRCUIT_COOLDOWN_MS: ${INFERENCE_CIRCUIT_COOLDOWN_MS:-30000}
      INFERENCE_AI_ENABLED: "true"
      SKIP_ARTICLE_CLASSIFICATION_ANALYSIS: "false"
      SKIP_ARTICLE_EMBEDDINGS: "false"
      SKIP_SEMANTIC_LABELING: ${SKIP_SEMANTIC_LABELING:-false}
      PROCESSING_JOB_POLL_INTERVAL_MS: ${PROCESSING_JOB_POLL_INTERVAL_MS:-1000}
      PROCESSING_JOB_CONCURRENCY: ${PROCESSING_JOB_CONCURRENCY:-1}
      PROCESSING_JOB_SHUTDOWN_TIMEOUT_MS: ${PROCESSING_JOB_SHUTDOWN_TIMEOUT_MS:-30000}
      PROCESSING_JOB_REPORT_INTERVAL_MS: ${PROCESSING_JOB_REPORT_INTERVAL_MS:-60000}
      AI_WORKER_HEALTH_FILE: /app/worker-health/ai-worker-health.json
      AI_WORKER_HEALTH_MAX_FAILURES: ${AI_WORKER_HEALTH_MAX_FAILURES:-3}
      AI_WORKER_HEALTH_MAX_STALE_MS: ${AI_WORKER_HEALTH_MAX_STALE_MS:-900000}

    init: true

    volumes:
      - rssmonster-worker-health:/app/worker-health

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - src/workers/checkAiWorkerHealth.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m

    networks:
      - rssmonster-network

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    container_name: rssmonster-inference
    restart: unless-stopped

    environment:
      NODE_ENV: production
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: 3001
      INFERENCE_MODEL_CACHE_DIR: /app/models
      INFERENCE_DEBUG: "false"

      EMBEDDING_PROVIDER: qwen
      EMBEDDING_MODEL: onnx-community/Qwen3-Embedding-0.6B-ONNX
      EMBEDDING_DIMENSIONS: 1024
      EMBEDDING_MAX_BATCH_SIZE: 8
      EMBEDDING_QUEUE_MAX_PENDING: ${EMBEDDING_QUEUE_MAX_PENDING:-4}

      GENERATION_PROVIDER: qwen
      GENERATION_MODEL: onnx-community/Qwen3.5-0.8B-ONNX
      GENERATION_DTYPE: q4
      GENERATION_QUEUE_MAX_PENDING: ${GENERATION_QUEUE_MAX_PENDING:-4}

      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      ARTICLE_SCORING_PROVIDER: modernbert
      MODERNBERT_MODEL: onnx-community/ModernBERT-base-nli-ONNX
      MODERNBERT_DTYPE: q8
      MODERNBERT_QUEUE_MAX_PENDING: ${MODERNBERT_QUEUE_MAX_PENDING:-4}

    volumes:
      - inference-model-cache:/app/models

    init: true

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3001/ready')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m

    networks:
      - rssmonster-network

  mysql:
    image: mysql:8.4
    container_name: rssmonster-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rssmonster}
      MYSQL_USER: ${DB_USERNAME:-rssmonster}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >
          mysqladmin ping
          --host=127.0.0.1
          --user=root
          --password="$${MYSQL_ROOT_PASSWORD}"
          --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - rssmonster-network

volumes:
  mysql-data:
  inference-model-cache:
  rssmonster-worker-health:

networks:
  rssmonster-network:
    driver: bridge
