codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        enabled: false

      client:
        target: 70%
        threshold: 0%
        flags:
          - client

      server:
        target: 70%
        threshold: 0%
        flags:
          - server

      inference:
        target: 70%
        threshold: 0%
        flags:
          - inference

    patch:
      default:
        enabled: false

flags:
  client:
    paths:
      - client/
    carryforward: false
  server:
    paths:
      - server/
    carryforward: false
  inference:
    paths:
      - inference/
    carryforward: false

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
