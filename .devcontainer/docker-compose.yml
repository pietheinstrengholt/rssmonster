name: rssmonster-devcontainer

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: 22-bookworm

    command: sleep infinity
    init: true

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      NODE_ENV: development
      PORT: 3000

      DB_DIALECT: mysql
      DB_HOSTNAME: mysql
      DB_PORT: 3306
      DB_DATABASE: rssmonster
      DB_USERNAME: rssmonster
      DB_PASSWORD: rssmonster

      JWT_SECRET: development-only-jwt-secret
      FEVER_CREDENTIAL_SECRET: development-only-fever-secret

      INFERENCE_URL: http://127.0.0.1:3001
      INFERENCE_AI_ENABLED: "true"
      INTERNAL_MCP_URL: http://127.0.0.1:3000/mcp

      VITE_APP_HOSTNAME: http://localhost:3000
      VITE_BASE_URL: /

    volumes:
      - ..:/workspace:cached
      - client-node-modules:/workspace/client/node_modules
      - server-node-modules:/workspace/server/node_modules
      - inference-node-modules:/workspace/inference/node_modules
      - inference-model-cache:/workspace/inference/.cache/models
      - npm-cache:/home/node/.npm

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: rssmonster
      MYSQL_USER: rssmonster
      MYSQL_PASSWORD: rssmonster
      MYSQL_ROOT_PASSWORD: rssmonster

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  client-node-modules:
  server-node-modules:
  inference-node-modules:
  inference-model-cache:
  mysql-data:
  npm-cache:
