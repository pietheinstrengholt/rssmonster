name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"

jobs:
  server-mysql:
    name: Server — MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rssmonstertest
          MYSQL_USER: rssmonster
          MYSQL_PASSWORD: rssmonster
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_DIALECT: mysql
      DB_DATABASE: rssmonstertest
      DB_USERNAME: rssmonster
      DB_PASSWORD: rssmonster
      DB_HOSTNAME: 127.0.0.1
      JWT_SECRET: test-secret-used-for-sign-and-verify
      FEVER_CREDENTIAL_SECRET: test-fever-credential-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Hard reset database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS rssmonstertest;"
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE rssmonstertest;"

      - name: Run migrations
        working-directory: server
        run: npx sequelize db:migrate

      - name: Seed database
        working-directory: server
        run: npx sequelize db:seed:all

      - name: Test server
        working-directory: server
        run: npm run test:coverage

      - name: Upload server coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./server/coverage/clover.xml
          disable_search: true
          flags: server
          name: server-mysql
          fail_ci_if_error: true

  server-sqlite:
    name: Server — SQLite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DB_DIALECT: sqlite
      DB_STORAGE: ${{ runner.temp }}/rssmonster-tests.sqlite
      JWT_SECRET: test-secret-used-for-sign-and-verify
      FEVER_CREDENTIAL_SECRET: test-fever-credential-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Verify migrations and seeders
        working-directory: server
        env:
          DB_STORAGE: ${{ runner.temp }}/rssmonster-seed-smoke.sqlite
        run: |
          npx sequelize db:migrate
          npx sequelize db:seed:all

      - name: Prepare SQLite test database
        working-directory: server
        run: npx sequelize db:migrate

      # The full suite retains MySQL-specific locking and concurrency contracts.
      - name: Test SQLite compatibility
        working-directory: server
        run: npm run test:sqlite

  client:
    name: Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        env:
          VITE_APP_HOSTNAME: http://localhost:3000
          VITE_ENABLE_AGENT: false
        run: npm run build

      - name: Test client
        working-directory: client
        env:
          VITE_APP_HOSTNAME: http://localhost:3000
          VITE_ENABLE_AGENT: false
        run: npm run test:coverage

      - name: Upload client coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./client/coverage/lcov.info
          disable_search: true
          flags: client
          name: client
          fail_ci_if_error: true
