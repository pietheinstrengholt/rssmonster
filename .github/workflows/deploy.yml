name: Deploy RSSMonster

on:
  # Docs-only changes do not start CI, so they cannot trigger this deployment.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy
        run: |
          bash /home/piethein/rssmonster-dev/deploy.sh
